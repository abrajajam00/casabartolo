<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c40">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa Bartolo">
<title>Calculadora Casa Bartolo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f2;--card:#fff;--ink:#1c2b22;--mute:#5f6f65;--line:#dde5dc;--accent:#1f5c40;--accent-ink:#fff;--bar:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1a251e;--ink:#eaf2ec;--mute:#9fb2a5;--line:#2a3a30;--accent:#6fcf9c;--accent-ink:#0f1f16;--bar:#1a251e}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1a251e;--ink:#eaf2ec;--mute:#9fb2a5;--line:#2a3a30;--accent:#6fcf9c;--accent-ink:#0f1f16;--bar:#1a251e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:290px}
header{padding:20px 16px 8px;max-width:640px;margin:0 auto}
.logo{display:block;width:96px;height:96px;border-radius:50%;margin:0 0 10px}
h1{margin:0;font-size:24px;font-weight:800}
header p{margin:4px 0 0;color:var(--mute);font-size:15px}
main{max-width:640px;margin:0 auto;padding:8px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pic{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:56px}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:10px 12px 4px}
.name{font-weight:800;font-size:17px}
.price{color:var(--mute);font-size:14px}
.step{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 12px}
.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:24px;font-weight:700;cursor:pointer;font-family:inherit}
.step button:active{background:var(--accent);color:var(--accent-ink)}
.step button:focus-visible,.clear:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.qty{font-size:22px;font-weight:800;min-width:32px;text-align:center}
input.qty{width:64px;font-family:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:6px 4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:640px;margin:0 auto;display:grid;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px}
.row label{color:var(--mute)}
.labor{display:flex;align-items:center;gap:6px}
.labor input{width:110px;font:inherit;font-weight:700;font-size:18px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:right}
.total{font-size:28px;font-weight:800;color:var(--accent)}
.sep{border-top:1px dashed var(--line);margin:2px 0}
.gan{font-size:22px;font-weight:800}
.gan.neg{color:#c0392b}
.clear{justify-self:start;background:none;border:none;color:var(--mute);font:inherit;font-size:14px;text-decoration:underline;padding:4px 0;cursor:pointer}
</style>
</head>

var q=FLORES.map(function(){return 0});
var $=function(id){return document.getElementById(id)};
var money=function(n){return "$"+n.toLocaleString("es-MX")};
var lista=$("lista");
FLORES.forEach(function(f,i){
  var d=document.createElement("div");d.className="card";d.id="c"+i;
  var pic=f.img?'<img src="'+f.img+'" alt="'+f.n+'">':f.e;
  d.innerHTML='<div class="pic" style="background:'+f.c+'">'+pic+'</div>'+
   '<div class="info"><div class="name">'+f.n+'</div><div class="price">'+money(f.p)+' c/u</div></div>'+
   '<div class="step"><button type="button" aria-label="Quitar '+f.n+'" data-i="'+i+'" data-d="-1">−</button>'+
   (f.libre?'<input class="qty" id="q'+i+'" type="text" inputmode="numeric" value="0" aria-label="Cantidad de '+f.n+'" data-i="'+i+'">':'<span class="qty" id="q'+i+'" aria-live="polite">0</span>')+
   '<button type="button" aria-label="Agregar '+f.n+'" data-i="'+i+'" data-d="1">+</button></div>';
  lista.appendChild(d);
});
function num(id){return parseInt(($(id).value||"").replace(/\D/g,""),10)||0}
function mano(){return num("mano")}
function calc(){
  var s=0;
  FLORES.forEach(function(f,i){s+=f.p*q[i];var el=$("q"+i);if(el.tagName==="INPUT"){if(document.activeElement!==el)el.value=q[i]}else el.textContent=q[i];$("c"+i).classList.toggle("on",q[i]>0)});
  $("subtotal").textContent=money(s);
  var t=s+mano(),g=t-num("gasto");
  $("total").textContent=money(t);
  $("gan").textContent=(g<0?"-":"")+money(Math.abs(g));
  $("gan").classList.toggle("neg",g<0);
}
lista.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var i=+b.dataset.i;q[i]=Math.max(0,q[i]+(+b.dataset.d));calc();
});
lista.addEventListener("input",function(e){
  var t=e.target;if(t.tagName!=="INPUT")return;
  var v=t.value.replace(/\D/g,"");t.value=v;q[+t.dataset.i]=parseInt(v,10)||0;calc();
});
lista.addEventListener("focusout",function(e){if(e.target.tagName==="INPUT")e.target.value=q[+e.target.dataset.i]});
lista.addEventListener("focusin",function(e){if(e.target.tagName==="INPUT"&&e.target.value==="0")e.target.select()});
["mano","gasto"].forEach(function(id){$(id).addEventListener("input",function(){
  var v=this.value.replace(/\D/g,"");this.value=v?parseInt(v,10).toLocaleString("es-MX"):"";calc();
})});
$("limpiar").addEventListener("click",function(){q=FLORES.map(function(){return 0});$("mano").value="";$("gasto").value="";calc()});
calc();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
